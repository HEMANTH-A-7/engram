<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Layer — Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Chart.js vendored locally (no CDN) to keep the dashboard fully offline. -->
  <script src="/static/vendor/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Extended Memory Layer</h1>
    <p class="sub">Live dashboard · built over Cognee · 100% offline</p>
  </header>

  <section id="live" class="live-panel">
    <span class="live-label">Live</span>
    <span class="live-stat">Current facts: <strong id="live-total">…</strong></span>
    <span class="live-stat">Hot <strong id="live-hot">…</strong></span>
    <span class="live-stat">Warm <strong id="live-warm">…</strong></span>
    <span class="live-stat">Cold <strong id="live-cold">…</strong></span>
  </section>

  <main class="grid">
    <div class="card" id="card-tokens">
      <h2>Tokens saved vs. raw history</h2>
      <div class="headline" id="tokens-headline">…</div>
      <p class="caption" id="tokens-caption"></p>
      <canvas id="tokens-chart"></canvas>
    </div>

    <div class="card" id="card-revisions">
      <h2>Fact revisions &amp; tiers</h2>
      <div class="headline" id="revisions-headline">…</div>
      <p class="caption" id="revisions-caption"></p>
      <canvas id="tiers-chart"></canvas>
    </div>

    <div class="card wide" id="card-storage">
      <h2>Storage growth over time</h2>
      <p class="caption">Raw history vs. versioned memory layer</p>
      <canvas id="storage-chart"></canvas>
    </div>
  </main>

  <footer>
    <p id="footer-note">Live from <code>main_dataset</code> · refreshes every 4s</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
