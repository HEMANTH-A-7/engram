[project]
name = "memory-layer"
version = "0.1.0"
description = "Extended memory layer for AI agents: bi-temporal conflict resolution, tiered consolidation, and benchmarks over Cognee."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cognee>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
